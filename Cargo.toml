[package]
name = "ha-core"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jethac/ha-core"
description = "Headless Rust client for the Home Assistant WebSocket API"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["serde", "std", "clock"] }
futures-util = { version = "0.3.34", features = ["sink"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
